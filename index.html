<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
    color: red;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    width: 90%;
    max-width: 400px;
}

/* Heading */
h1 {
    font-size: 22px;
    margin-bottom: 10px;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

p {
    font-size: 14px;
}

/* Progress Bar */
.progress {
    width: 100%;
    height: 18px;
    background: #333;
    margin: 15px 0;
    border-radius: 10px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: red;
}

/* Button */
button {
    padding: 10px;
    font-size: 14px;
    background: red;
    border: none;
    color: white;
    border-radius: 5px;
    display: none;
    width: 100%;
}

/* Small devices */
@media (max-width: 400px) {
    h1 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>⚠️ Device Hacked!</h1>
    <p>Scanning files...</p>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <p id="percent">0%</p>

    <button id="btn">Fix Now</button>
</div>

<script>
let width = 0;
let bar = document.getElementById("bar");
let percent = document.getElementById("percent");
let btn = document.getElementById("btn");

// Fullscreen on mobile click
document.body.onclick = () => {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
};

// Vibration (mobile)
if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
}

let interval = setInterval(() => {
    if (width >= 100) {
        clearInterval(interval);
        percent.innerText = "Data Breached!";
        btn.style.display = "block";
    } else {
        width++;
        bar.style.width = width + "%";
        percent.innerText = width + "%";
    }
}, 30);

// Final reveal
btn.onclick = function() {
    document.body.innerHTML = `
    <div style="color:white; text-align:center;">
        <h1 style="font-size:28px;">😂 APRIL FOOL 😂</h1>
        <p style="margin-top:10px;">You are safe 😎</p>
        <p style="margin-top:20px; color:yellow;">
            Prank by @iam_akashray_
        </p>
    </div>
    `;
}
</script>

</body>
</html>
